name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands vereist opname in home-assistant/brands - alleen
          # nodig voor de standaard-HACS-store, niet voor een custom
          # repository. Weglaten zodra het merk daar is ingediend.
          ignore: brands
